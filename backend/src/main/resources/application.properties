spring.application.name=panenku-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/panenku}
spring.datasource.username=${DB_USER:panenku}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
panenku.jwt.secret=${JWT_SECRET}
panenku.jwt.issuer=${JWT_ISSUER:panenku}
