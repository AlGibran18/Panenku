# Server
server.port=${SERVER_PORT:8080}
spring.application.name=panenku-backend

# Database PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/panenku}
spring.datasource.username=${DB_USER:panenku}
spring.datasource.password=${DB_PASSWORD:panenku}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:panenku-rahasia-jwt-2026}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# MinIO / S3 (file privat: KTP, bukti pembayaran, dll)
minio.endpoint=${MINIO_ENDPOINT:localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:panenku-files}